# Single entry point for humans, Claude and CI: pins the toolchain and runs the same tasks
# everywhere. Each task delegates to the project's native build (dotnet / npm).
[tools]
node = "24.14.0"
dotnet = "10.0.200"

# --- tasks -----------------------------------------------------------------------------------
# `mise run ci` is exactly what the pipeline's `check` step runs.

[tasks.install]
description = "Restore dotnet tools and install frontend dependencies (lockfile)"
run = ["dotnet tool restore", "npm ci --prefix frontend"]

[tasks."backend:test"]
description = "Backend build + unit and API tests (API tests in-process)"
run = ["dotnet build", "dotnet test"]

# The Kiota client is committed (frontend/src/api) so the frontend and the Docker build need no
# dotnet. This regenerates it from the OpenAPI document the build writes to artifacts/openapi and
# fails if the code changed; locally, the regenerated files are left in place to commit.
# kiota-lock.json is left out: its descriptionHash follows every spec change (even the title a
# `dotnet new` rename touches) without the generated code changing.
[tasks."client:check"]
description = "Regenerate the TS client and fail if the committed one has drifted from the API"
run = """
#!/usr/bin/env bash
set -euo pipefail
dotnet build src/Olve.Template.Api
before=$(mktemp -d)
trap 'rm -rf "$before"' EXIT
cp -r frontend/src/api/. "$before"
npm run --prefix frontend generate-client >/dev/null
rm -f frontend/src/api/.kiota.log
if ! diff -r -x kiota-lock.json "$before" frontend/src/api; then
  echo "frontend/src/api is out of date with the API: commit the regenerated client." >&2
  exit 1
fi
"""

# DELETE-WITH-THE-FRONTEND: a headless service that removes frontend/ deletes this task,
# client:check, their entries in `ci`, and the npm half of `install`.
[tasks."frontend:check"]
description = "Frontend lint, tests, production build"
dir = "frontend"
run = ["npm run lint", "npm test", "npm run build"]

# The AOT check: in-process API tests run JIT, so serialization gaps only a trimmed native binary
# has (a missing JsonSerializable, reflection) show up here or on beta. Not in `ci` (needs Docker).
[tasks."api:image"]
description = "API tests against the real Docker image: builds and starts it, runs the suite in base-URL mode (needs Docker)"
run = """
#!/usr/bin/env bash
set -euo pipefail
image="olve-template-api:api-test"
key="api-image-test-signing-key-that-is-long-enough"
docker build -t "$image" .
container=$(docker run -d -p 127.0.0.1::5000 -e Host=0.0.0.0 \
  -e Auth__SigningKey="$key" -e Auth__Authority=api-test -e Auth__Audience=api-test "$image")
trap 'docker rm -f "$container" >/dev/null' EXIT
url="http://$(docker port "$container" 5000/tcp | head -n1)"
for _ in $(seq 60); do curl -fs "$url/health" >/dev/null && break || sleep 1; done
API_BASE_URL="$url" API_SIGNING_KEY="$key" API_ISSUER=api-test API_AUDIENCE=api-test \
  dotnet test --project test/Olve.Template.Api.ApiTests
"""

[tasks."api:remote"]
description = "API tests against a deployed server: set API_BASE_URL (tests needing a token skip unless API_SIGNING_KEY/ISSUER/AUDIENCE are set)"
run = """
#!/usr/bin/env bash
set -euo pipefail
: "${API_BASE_URL:?set API_BASE_URL to the server under test}"
dotnet test --project test/Olve.Template.Api.ApiTests
"""

[tasks.ci]
description = "Everything the pipeline gate runs"
run = [
  { task = "install" },
  { task = "backend:test" },
  { task = "client:check" },
  { task = "frontend:check" },
]
