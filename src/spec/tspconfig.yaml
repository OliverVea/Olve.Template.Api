# Generated output goes to the repo's artifacts/ (gitignored), never into source folders.
output-dir: "{project-root}/../../artifacts"
emit:
  - "@typespec/openapi3"
  - "@olivervea/typespec-csharp"
options:
  "@typespec/openapi3":
    # 3.0: TypeSpec writes a `Record<T>` as `additionalProperties` there, which Hey API types.
    openapi-versions: ["3.0.0"]
    file-type: json
    emitter-output-dir: "{output-dir}/spec"
  "@olivervea/typespec-csharp":
    emitter-output-dir: "{output-dir}/generated"
    namespace: "Olve.Template.Api.Contract"
