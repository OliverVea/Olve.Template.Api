{{- if eq (include "app.dexEnabled" .) "true" }}
{{- $issuer := .Values.auth.issuer }}
{{- $u := urlParse $issuer }}
{{- $origin := printf "%s://%s" $u.scheme $u.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dex
  labels:
    app: {{ .Release.Name }}-dex
data:
  config.yaml: |
    issuer: {{ $issuer }}
    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db
    web:
      http: 0.0.0.0:5556
      allowedOrigins: [{{ $origin | quote }}]
    telemetry:
      http: 0.0.0.0:5558
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          redirectURI: {{ $issuer }}/callback
          {{- if ((.Values.auth.allow | default dict).orgs) }}
          # groups = the user's orgs and org:team slugs, for auth.allow.orgs (GitHub asks for read:org)
          loadAllGroups: true
          teamNameField: slug
          {{- end }}
    staticClients:
      # The SPA: a public client (PKCE, no secret). With redirectURIs listed, Dex accepts only those.
      - id: {{ .Values.auth.clientId | default .Chart.Name }}
        name: {{ .Chart.Name }}
        public: true
        redirectURIs:
          - {{ printf "%s/callback" $origin | quote }}
          {{- range .Values.dex.extraRedirectURIs }}
          - {{ . | quote }}
          {{- end }}
{{- end }}
