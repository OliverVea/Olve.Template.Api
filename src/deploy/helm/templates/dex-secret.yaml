{{- if and (eq (include "app.dexEnabled" .) "true") .Values.dex.github }}
{{- with .Values.dex.github }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-dex-github
  labels:
    app: {{ $.Release.Name }}-dex
type: Opaque
stringData:
  github-client-id: {{ required "dex.github.clientId is required with dex.github" .clientId | quote }}
  github-client-secret: {{ required "dex.github.clientSecret is required with dex.github" .clientSecret | quote }}
{{- end }}
{{- end }}
