apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.container.port }}
          env:
            {{- range $key, $value := (include "app.config" . | fromYaml) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.telemetry }}
            {{- if eq .exporter "otlp" }}
            - name: OpenTelemetry__Endpoint
              value: {{ required "telemetry.endpoint is required for exporter otlp" .endpoint | quote }}
            - name: OpenTelemetry__Protocol
              value: {{ .protocol | default "http" | quote }}
            {{- with (.headers | default dict).kubernetesSecret }}
            - name: OpenTelemetry__Headers
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- else if ne .exporter "none" }}
            {{- fail (printf "telemetry.exporter must be none or otlp, got %q" .exporter) }}
            {{- end }}
            {{- end }}
            {{- range .Values.secrets }}
            {{- $secretName := .name }}
            {{- range $envVar, $key := .envMap }}
            - name: {{ $envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
