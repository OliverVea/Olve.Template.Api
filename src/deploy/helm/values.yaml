replicaCount: 1

image:
  repository: olve-template-api
  tag: latest
  # Pins the image (repository:tag@digest); empty = by tag.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# How users sign in, mapped onto config.Auth__* (templates/_helpers.tpl). Empty = config.Auth__* as given.
#   mode: none                       # Auth__Disable=true: every endpoint is anonymous
#   mode: dex                        # the bundled Dex below, GitHub upstream
#     issuer: https://<host>/dex
#     bundled: false                 # use an existing Dex at issuer instead; it must list clientId as a
#                                    # public static client with https://<host>/callback as a redirect URI
#     clientId: olve-template-api    # the SPA's public client; default the chart name
#     allow: { users: [<github login>], orgs: [<org or org:team>], emails: [], subjects: [] }
#   mode: authentik, authority, audience, frontendAuthority?, frontendAudience?
# Required, here or as config.Auth__*: the chart refuses to render without auth, and dex without allow.
# The pipeline sets it from its `auth` config (per target with target.<stage>.auth).
auth: {}

# Bundled Dex (OIDC with a GitHub upstream), rendered when auth.mode is dex unless auth.bundled is
# false, and served under /dex on the app's host: the edge (Olve.Homelab) routes <host>/dex to the
# <release>-dex Service. The GitHub OAuth app (callback URL <auth.issuer>/callback): `github`, which the
# chart renders as the Secret <release>-dex-github (the pipeline sets it from its dexBeta/dexProd config),
# or else an existing Secret named githubSecret (keys github-client-id, github-client-secret).
dex:
  image: "dexidp/dex:v2.43.1"
  # How long a signed-in token stays valid (a Go duration; Dex's own default is 24h).
  tokenLifetime: 168h
  # github: { clientId: <Client ID>, clientSecret: <client secret> }
  github: null
  githubSecret: olve-template-api-dex
  # More redirect URIs for the SPA client, e.g. http://localhost:5173/callback for a local Vite.
  extraRedirectURIs: []
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  # JSON lines on stdout: the homelab's node collector ships them to OpenObserve as queryable fields.
  Logging__Console__FormatterName: "json"

# Extra env vars from existing Secrets: [{ name: <secret>, envMap: { <ENV_VAR>: <key> } }].
secrets: []

# Where the app exports traces, metrics and logs over OTLP. `none` = no exporter (logs still reach
# OpenObserve through stdout). For a collector:
#   exporter: otlp
#   endpoint: http://collector:4318      # traces, metrics and logs under /v1/…
#   protocol: http                       # or grpc
#   headers:                             # only when the receiver needs a key
#     kubernetesSecret: { name: otlp-headers, key: headers }   # "k1=v1,k2=v2"
telemetry:
  exporter: none
