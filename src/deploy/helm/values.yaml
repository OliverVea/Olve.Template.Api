replicaCount: 1

image:
  repository: olve-template-api
  tag: latest
  # Pins the image (repository:tag@digest); empty = by tag.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Auth__Authority: "https://auth.ovea.pro/application/o/olve-template-api/"
  Auth__Audience: "olve-template-api"
  # Public PKCE client the SPA logs in as (separate from the confidential client used for machine
  # tokens). Its tokens carry this provider's `iss` and an `aud` of its own client id, so
  # AuthenticationConfiguration trusts both issuers AND both audiences. The SPA reads these at
  # runtime from GET /api/auth-config. Defined as an Authentik blueprint in Olve.Authentik.
  Auth__Frontend__Authority: "https://auth.ovea.pro/application/o/olve-template-api-spa/"
  Auth__Frontend__ClientId: "olve-template-api-spa"
  # JSON lines on stdout: the homelab's node collector ships them to OpenObserve as queryable fields.
  Logging__Console__FormatterName: "json"

# Extra env vars from existing Secrets: [{ name: <secret>, envMap: { <ENV_VAR>: <key> } }].
secrets: []

# Where the app exports traces, metrics and logs over OTLP. `none` = no exporter (logs still reach
# OpenObserve through stdout). For a collector:
#   exporter: otlp
#   endpoint: http://collector:4318      # traces, metrics and logs under /v1/…
#   protocol: http                       # or grpc
#   headers:                             # only when the receiver needs a key
#     kubernetesSecret: { name: otlp-headers, key: headers }   # "k1=v1,k2=v2"
telemetry:
  exporter: none

# Mounts the Authentik CA (shared `authentik-ca` configMap in the namespace) so the app trusts
# outbound TLS to *.ovea.pro: JWT validation fetches JWKS from Authentik. values-beta.yaml overrides
# fileName for the beta CA.
authentikCa:
  enabled: true
  fileName: auth-prod-ca.crt
